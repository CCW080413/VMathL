<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualMATH - 指数与对数</title>
    <link rel="stylesheet" href="interactive-tool.css">
</head>

<body>
    <div class="page-container">
        <header class="top-bar">
            <button class="back-button" onclick="goBack()">← 返回</button>
            <h1 class="page-title">指数与对数函数</h1>
            <div class="placeholder"></div>
        </header>

        <div class="main-content">
            <div class="canvas-container">
                <button class="fullscreen-toggle" onclick="toggleFullscreen()">⛶ 全屏</button>
                <canvas id="expLogCanvas"></canvas>
                <div class="canvas-overlay">
                    <div class="control-panel">
                        <div class="control-group">
                            <label>指数函数 y = aᵇˣ</label>
                            <div class="input-row">
                                <input type="number" id="exp-base" placeholder="底数 a" value="2" step="0.1" min="0.1">
                                <span>^(</span>
                                <input type="number" id="exp-coeff" placeholder="系数 b" value="1" step="0.1">
                                <span>x)</span>
                            </div>
                        </div>
                        <div class="control-group">
                            <label>对数函数 y = log_a(x)</label>
                            <div class="input-row">
                                <span>log_</span>
                                <input type="number" id="log-base" placeholder="底数" value="2" step="0.1" min="0.1">
                                <span>(x)</span>
                            </div>
                        </div>
                        <div class="operation-buttons">
                            <button onclick="updateExpLog()">更新</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="info-panel">
                <div class="info-card">
                    <h3>指数函数</h3>
                    <div class="formula">y = aᵇˣ</div>
                    <div class="result" id="exp-info">y = 2^x</div>
                </div>

                <div class="info-card">
                    <h3>对数函数</h3>
                    <div class="formula">y = log_a(x)</div>
                    <div class="result" id="log-info">y = log₂(x)</div>
                </div>

                <div class="info-card">
                    <h3>指数性质</h3>
                    <div class="formula">aˣ · aʸ = aˣ⁺ʸ</div>
                    <div class="result" id="exp-prop">a > 0 且 a ≠ 1</div>
                </div>

                <div class="info-card">
                    <h3>对数性质</h3>
                    <div class="formula">log_a(x·y) = log_a(x) + log_a(y)</div>
                    <div class="result" id="log-prop">a > 0 且 a ≠ 1</div>
                </div>

                <div class="info-card">
                    <h3>指数函数值</h3>
                    <div class="formula">当 x = 1 时</div>
                    <div class="result" id="exp-at-1">y = 2</div>
                </div>

                <div class="info-card">
                    <h3>对数函数值</h3>
                    <div class="formula">当 x = 底数 时</div>
                    <div class="result" id="log-at-base">y = 1</div>
                </div>

                <div class="info-card">
                    <h3>互为反函数</h3>
                    <div class="formula">y = aˣ 和 y = log_a(x)</div>
                    <div class="result" id="inverse-info">关于 y = x 对称</div>
                </div>
            </div>
        </div>
    </div>

    <script src="exponential_logarithm.js"></script>
    <script src="fullscreen.js"></script>
</body>

</html>
