<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualMATH - 坐标与直线</title>
    <link rel="stylesheet" href="interactive-tool.css">
</head>

<body>
    <div class="page-container">
        <header class="top-bar">
            <button class="back-button" onclick="goBack()">← 返回</button>
            <h1 class="page-title">坐标系与直线方程</h1>
            <div class="placeholder"></div>
        </header>

        <div class="main-content">
            <div class="canvas-container">
                <button class="fullscreen-toggle" onclick="toggleFullscreen()">⛶ 全屏</button>
                <canvas id="coordCanvas"></canvas>
                <div class="canvas-overlay">
                    <div class="control-panel">
                        <div class="control-group">
                            <label>点 A 坐标</label>
                            <div class="input-row">
                                <input type="number" id="point-ax" placeholder="x" value="2" step="0.5">
                                <input type="number" id="point-ay" placeholder="y" value="1" step="0.5">
                            </div>
                        </div>
                        <div class="control-group">
                            <label>点 B 坐标</label>
                            <div class="input-row">
                                <input type="number" id="point-bx" placeholder="x" value="4" step="0.5">
                                <input type="number" id="point-by" placeholder="y" value="5" step="0.5">
                            </div>
                        </div>
                        <div class="control-group">
                            <label>直线斜率 m =</label>
                            <input type="number" id="line-slope" value="1" step="0.5">
                        </div>
                        <div class="operation-buttons">
                            <button onclick="updateCoord()">更新</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="info-panel">
                <div class="info-card">
                    <h3>两点间距离</h3>
                    <div class="formula">d = √((x₂-x₁)² + (y₂-y₁)²)</div>
                    <div class="result" id="distance">d ≈ 4.47</div>
                </div>

                <div class="info-card">
                    <h3>中点坐标</h3>
                    <div class="formula">M = ((x₁+x₂)/2, (y₁+y₂)/2)</div>
                    <div class="result" id="midpoint">M = (3, 3)</div>
                </div>

                <div class="info-card">
                    <h3>斜率</h3>
                    <div class="formula">m = (y₂-y₁)/(x₂-x₁)</div>
                    <div class="result" id="slope">m = 2</div>
                </div>

                <div class="info-card">
                    <h3>直线方程 (点斜式)</h3>
                    <div class="formula">y - y₁ = m(x - x₁)</div>
                    <div class="result" id="line-equation">y - 1 = 2(x - 2)</div>
                </div>

                <div class="info-card">
                    <h3>直线方程 (斜截式)</h3>
                    <div class="formula">y = mx + b</div>
                    <div class="result" id="line-intercept">y = 2x - 3</div>
                </div>

                <div class="info-card">
                    <h3>x 截距</h3>
                    <div class="formula">当 y = 0 时的 x 值</div>
                    <div class="result" id="x-intercept">x = 1.5</div>
                </div>

                <div class="info-card">
                    <h3>y 截距</h3>
                    <div class="formula">当 x = 0 时的 y 值</div>
                    <div class="result" id="y-intercept">y = -3</div>
                </div>
            </div>
        </div>
    </div>

    <script src="coordinates_lines.js"></script>
    <script src="fullscreen.js"></script>
</body>

</html>
