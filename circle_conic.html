<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualMATH - 圆与二次曲线</title>
    <link rel="stylesheet" href="interactive-tool.css">
</head>

<body>
    <div class="page-container">
        <header class="top-bar">
            <button class="back-button" onclick="goBack()">← 返回</button>
            <h1 class="page-title">圆与椭圆方程</h1>
            <div class="placeholder"></div>
        </header>

        <div class="main-content">
            <div class="canvas-container">
                <button class="fullscreen-toggle" onclick="toggleFullscreen()">⛶ 全屏</button>
                <canvas id="conicCanvas"></canvas>
                <div class="canvas-overlay">
                    <div class="control-panel">
                        <div class="control-group">
                            <label>圆的圆心</label>
                            <div class="input-row">
                                <input type="number" id="circle-cx" placeholder="h" value="0" step="0.5">
                                <input type="number" id="circle-cy" placeholder="k" value="0" step="0.5">
                            </div>
                        </div>
                        <div class="control-group">
                            <label>圆的半径 r =</label>
                            <input type="number" id="circle-radius" value="2" step="0.5" min="0.5">
                        </div>
                        <div class="control-group">
                            <label>椭圆长轴 a =</label>
                            <input type="number" id="ellipse-a" value="3" step="0.5" min="0.5">
                        </div>
                        <div class="control-group">
                            <label>椭圆短轴 b =</label>
                            <input type="number" id="ellipse-b" value="2" step="0.5" min="0.5">
                        </div>
                        <div class="operation-buttons">
                            <button onclick="updateConic()">更新</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="info-panel">
                <div class="info-card">
                    <h3>圆的标准方程</h3>
                    <div class="formula">(x - h)² + (y - k)² = r²</div>
                    <div class="result" id="circle-eq">x² + y² = 4</div>
                </div>

                <div class="info-card">
                    <h3>圆的周长</h3>
                    <div class="formula">C = 2πr</div>
                    <div class="result" id="circle-circumference">C ≈ 12.57</div>
                </div>

                <div class="info-card">
                    <h3>圆的面积</h3>
                    <div class="formula">A = πr²</div>
                    <div class="result" id="circle-area">A ≈ 12.57</div>
                </div>

                <div class="info-card">
                    <h3>椭圆标准方程</h3>
                    <div class="formula">x²/a² + y²/b² = 1</div>
                    <div class="result" id="ellipse-eq">x²/9 + y²/4 = 1</div>
                </div>

                <div class="info-card">
                    <h3>椭圆焦距</h3>
                    <div class="formula">c² = a² - b²</div>
                    <div class="result" id="ellipse-focal">c ≈ 2.24</div>
                </div>

                <div class="info-card">
                    <h3>椭圆离心率</h3>
                    <div class="formula">e = c/a</div>
                    <div class="result" id="ellipse-eccentricity">e ≈ 0.75</div>
                </div>

                <div class="info-card">
                    <h3>椭圆面积</h3>
                    <div class="formula">A = πab</div>
                    <div class="result" id="ellipse-area">A ≈ 18.85</div>
                </div>
            </div>
        </div>
    </div>

    <script src="circle_conic.js"></script>
    <script src="fullscreen.js"></script>
</body>

</html>
