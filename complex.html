<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualMATH - 复数</title>
    <link rel="stylesheet" href="interactive-tool.css">
</head>

<body>
    <div class="page-container">
        <header class="top-bar">
            <button class="back-button" onclick="goBack()">← 返回</button>
            <h1 class="page-title">复数运算与表示</h1>
            <div class="placeholder"></div>
        </header>

        <div class="main-content">
            <div class="canvas-container">
                <button class="fullscreen-toggle" onclick="toggleFullscreen()">⛶ 全屏</button>
                <canvas id="complexCanvas"></canvas>
                <div class="canvas-overlay">
                    <div class="control-panel">
                        <div class="control-group">
                            <label>复数 Z₁ = a + bi</label>
                            <div class="input-row">
                                <input type="number" id="real1" placeholder="实部" value="3" step="0.5">
                                <span>+</span>
                                <input type="number" id="imag1" placeholder="虚部" value="2" step="0.5">
                                <span>i</span>
                            </div>
                        </div>
                        <div class="control-group">
                            <label>复数 Z₂ = c + di</label>
                            <div class="input-row">
                                <input type="number" id="real2" placeholder="实部" value="1" step="0.5">
                                <span>+</span>
                                <input type="number" id="imag2" placeholder="虚部" value="2" step="0.5">
                                <span>i</span>
                            </div>
                        </div>
                        <div class="operation-buttons">
                            <button onclick="updateComplex()">更新</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="info-panel">
                <div class="info-card">
                    <h3>Z₁ 极坐标</h3>
                    <div class="formula">|Z₁| = √(a² + b²)</div>
                    <div class="result" id="polar1">r = 0, θ = 0°</div>
                </div>

                <div class="info-card">
                    <h3>Z₂ 极坐标</h3>
                    <div class="formula">|Z₂| = √(c² + d²)</div>
                    <div class="result" id="polar2">r = 0, θ = 0°</div>
                </div>

                <div class="info-card">
                    <h3>Z₁ + Z₂</h3>
                    <div class="formula">(a + c) + (b + d)i</div>
                    <div class="result" id="sum">0 + 0i</div>
                </div>

                <div class="info-card">
                    <h3>Z₁ - Z₂</h3>
                    <div class="formula">(a - c) + (b - d)i</div>
                    <div class="result" id="diff">0 + 0i</div>
                </div>

                <div class="info-card">
                    <h3>Z₁ × Z₂</h3>
                    <div class="formula">(ac - bd) + (ad + bc)i</div>
                    <div class="result" id="product">0 + 0i</div>
                </div>

                <div class="info-card">
                    <h3>Z₁ ÷ Z₂</h3>
                    <div class="formula">(Z₁ × Z̄₂) / |Z₂|²</div>
                    <div class="result" id="quotient">0 + 0i</div>
                </div>

                <div class="info-card">
                    <h3>共轭复数</h3>
                    <div class="formula">Z̄₁ = a - bi</div>
                    <div class="result" id="conjugate">0 - 0i</div>
                </div>
            </div>
        </div>
    </div>

    <script src="complex.js"></script>
    <script src="fullscreen.js"></script>
</body>

</html>
