<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualMATH - 多项式</title>
    <link rel="stylesheet" href="interactive-tool.css">
</head>

<body>
    <div class="page-container">
        <header class="top-bar">
            <button class="back-button" onclick="goBack()">← 返回</button>
            <h1 class="page-title">多项式因式分解与根</h1>
            <div class="placeholder"></div>
        </header>

        <div class="main-content">
            <div class="canvas-container">
                <button class="fullscreen-toggle" onclick="toggleFullscreen()">⛶ 全屏</button>
                <canvas id="polyCanvas"></canvas>
                <div class="canvas-overlay">
                    <div class="control-panel">
                        <div class="control-group">
                            <label>多项式 P(x) = ax³ + bx² + cx + d</label>
                            <div class="input-row">
                                <input type="number" id="coeff-a" placeholder="a" value="1" step="0.1">
                                <span>x³ +</span>
                                <input type="number" id="coeff-b" placeholder="b" value="0" step="0.1">
                                <span>x² +</span>
                            </div>
                            <div class="input-row">
                                <input type="number" id="coeff-c" placeholder="c" value="-5" step="0.1">
                                <span>x +</span>
                                <input type="number" id="coeff-d" placeholder="d" value="6" step="0.1">
                            </div>
                        </div>
                        <div class="operation-buttons">
                            <button onclick="updatePolynomial()">更新</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="info-panel">
                <div class="info-card">
                    <h3>多项式表达式</h3>
                    <div class="formula">P(x) = ax³ + bx² + cx + d</div>
                    <div class="result" id="poly-expr">P(x) = x³ - 5x + 6</div>
                </div>

                <div class="info-card">
                    <h3>根 (Roots)</h3>
                    <div class="formula">P(r) = 0</div>
                    <div class="result" id="poly-roots">计算中...</div>
                </div>

                <div class="info-card">
                    <h3>导数</h3>
                    <div class="formula">P'(x) = 3ax² + 2bx + c</div>
                    <div class="result" id="poly-derivative">P'(x) = 3x² - 5</div>
                </div>

                <div class="info-card">
                    <h3>极值点</h3>
                    <div class="formula">P'(x) = 0</div>
                    <div class="result" id="poly-extrema">计算中...</div>
                </div>

                <div class="info-card">
                    <h3>Y 轴截距</h3>
                    <div class="formula">P(0) = d</div>
                    <div class="result" id="poly-intercept">d = 6</div>
                </div>

                <div class="info-card">
                    <h3>多项式特征</h3>
                    <div class="formula">最高次数 = 3</div>
                    <div class="result" id="poly-info">3 次多项式</div>
                </div>
            </div>
        </div>
    </div>

    <script src="polynomial.js"></script>
    <script src="fullscreen.js"></script>
</body>

</html>
